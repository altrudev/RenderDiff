[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "renderdiff"
version = "0.6.1b1"
description = "Evidence-backed representation-divergence assurance"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "DDCAL"}]
keywords = ["unicode", "security", "homoglyph", "bidi", "ascii-smuggling", "assurance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
renderdiff = "renderdiff.cli:main"
renderdiff-scan = "renderdiff.ci:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
renderdiff = ["data/*.txt", "web/*.html"]

[project.optional-dependencies]
documents = ["pypdf>=6,<7", "defusedxml>=0.7.1,<1"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1"]
models = ["tiktoken>=0.8,<1", "sentencepiece>=0.2,<1", "httpx>=0.27,<1"]
crypto = ["cryptography>=50,<51"]
browser = ["playwright>=1.50,<2"]
pdf = ["reportlab>=4,<5"]

[project.entry-points."renderdiff.extractors"]
